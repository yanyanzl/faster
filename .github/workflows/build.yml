name: Build Faster
on:
  workflow_dispatch:          # 在 Actions 页面手动点 Run workflow
  push:
    tags: ["v*"]              # 推送 v1.0.0 这样的 tag 会自动发布 Release
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 读取版本号
        shell: bash
        run: echo "VERSION=$(grep -m1 '^__version__' faster.py | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Run fetch_wordlist
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python fetch_wordlist.py
      # - run: python fetch_wordlist.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name Faster --icon icon.ico --collect-submodules send2trash --add-data "bip39_english.txt;." faster_gui.py
      - uses: actions/upload-artifact@v4
        with: { name: "Faster-${{ env.VERSION }}-windows", path: dist/Faster.exe }

  macos:
    runs-on: macos-latest      # Apple 芯片(arm64)；Intel Mac 请看 README
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 fetch_wordlist.py
      - run: bash build_mac.sh
      - name: 读取版本号
        run: echo "VERSION=$(grep -m1 '^__version__' faster.py | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: "Faster-${{ env.VERSION }}-macos", path: "dist/Faster-*.dmg" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with: { files: "artifacts/**/*" }
